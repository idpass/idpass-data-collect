{% extends "base.html" %}
{% block title %}{{ title }} — Mock Registry{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" action="{{ action }}">
  <label>Given name
    <input name="given_name" value="{{ person.given_name if person and person.given_name else '' }}">
  </label>
  <label>Family name
    <input name="family_name" value="{{ person.family_name if person and person.family_name else '' }}">
  </label>
  <label>Date of birth
    <input name="date_of_birth" type="date"
           value="{{ person.date_of_birth.isoformat() if person and person.date_of_birth else '' }}">
  </label>
  <label>Gender (ISO 5218)
    <select name="gender">
      {% set g = person.gender if person else '' %}
      <option value=""         {% if g == '' %}selected{% endif %}>(unspecified)</option>
      <option value="0"        {% if g == '0' %}selected{% endif %}>0 — Not known</option>
      <option value="1"        {% if g == '1' %}selected{% endif %}>1 — Male</option>
      <option value="2"        {% if g == '2' %}selected{% endif %}>2 — Female</option>
      <option value="9"        {% if g == '9' %}selected{% endif %}>9 — Not applicable</option>
    </select>
  </label>
  <button type="submit">Save</button>
  <a href="{% if person %}/ui/persons/{{ person.uuid }}{% else %}/ui/persons{% endif %}" role="button" class="secondary">Cancel</a>
</form>
{% endblock %}
