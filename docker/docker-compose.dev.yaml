name: idpass-data-collection-dev
services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    restart: always
    env_file: ./.env
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ./init-reset-dbs.sh:/docker-entrypoint-initdb.d/init-reset-dbs.sh
    ports:
      - "5432:5432"
    networks:
      - datacollect-network-dev
    command: ["postgres"]

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:9
    env_file: ./.env
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - datacollect-network-dev

  # DataCollect Sync Server - Development mode
  sync-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    env_file: ./.env
    environment:
      - PORTAL_ENABLED=true
      - PORTAL_KEYCLOAK_ISSUER=http://keycloak:8180/realms/datacollect
      - PORTAL_KEYCLOAK_CLIENT_ID=datacollect-portal
      - PORTAL_OPENSPP_URL=http://openspp:8069
      - PORTAL_OPENSPP_CLIENT_ID=datacollect-portal-service
      - PORTAL_OPENSPP_CLIENT_SECRET=changeme
      - PORTAL_OPENSPP_IDENTIFIER_NAMESPACE=urn:openspp:registrant
      - PORTAL_DRAFT_TTL_DAYS=30
    ports:
      - "${SYNC_SERVER_PORT:-3000}:3000"
      - "9229:9229"
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - datacollect-network-dev

  # Admin UI - Development mode
  admin-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: admin-ui
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - sync-server
    networks:
      - datacollect-network-dev

  # Mobile App - Browser Development mode
  mobile-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: mobile-app
    environment:
      - VITE_DB_ENCRYPTION_PASSWORD=password
      - VITE_DEVELOP=true
      - VITE_DEBUG=true
      - VITE_FEATURE_DYNAMIC=true
    ports:
      - "8081:8081"
    depends_on:
      - sync-server
    networks:
      - datacollect-network-dev

  # Beneficiary Portal - Development mode
  portal-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: portal
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_KEYCLOAK_ISSUER=http://localhost:8180/realms/datacollect
      - VITE_KEYCLOAK_CLIENT_ID=datacollect-portal
      - VITE_KEYCLOAK_REDIRECT_URI=http://localhost:5174/callback
      - VITE_KEYCLOAK_POST_LOGOUT_URI=http://localhost:5174
    ports:
      - "5174:5174"
    depends_on:
      - sync-server
      - keycloak
    networks:
      - datacollect-network-dev

  # Keycloak Identity Provider (for portal authentication)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command:
      - start-dev
      - --http-port=8180
    ports:
      - "8180:8180"
    networks:
      - datacollect-network-dev

volumes:
  postgres-data-dev:

networks:
  datacollect-network-dev:
    driver: bridge
