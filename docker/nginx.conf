events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 20M;

    upstream sync_server {
        server sync-server:3000;
    }

    upstream admin_ui {
        server admin-ui:80;
    }

    upstream web_ui {
        server web-ui:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Web UI (citizen/agent portal) — served from /web/ sub-path
        # vite preview is built with base=/web/, so it expects the /web/ prefix
        location /web/ {
            proxy_pass http://web_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SPA fallback: on 404 from vite preview, serve index.html
            proxy_intercept_errors on;
            error_page 404 = @web_spa_fallback;
        }

        # Named location for SPA fallback — avoids redirect loop
        location @web_spa_fallback {
            rewrite ^ /web/index.html break;
            proxy_pass http://web_ui;
            proxy_set_header Host $host;
        }

        # Admin UI - serve from root
        location / {
            proxy_pass http://admin_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sync Server API - serve from /api
        location /sync/ {
            rewrite ^/sync/(.*) /$1 break;
            proxy_pass http://sync_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}