name: Mock Server (Python)

on:
  push:
    branches: [main, develop]
    paths:
      - "examples/mock-server/**"
      - ".github/workflows/mock-server.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "examples/mock-server/**"
      - ".github/workflows/mock-server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/mock-server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

      - name: Syntax-check all Python files
        run: uv run python -m compileall mock_server tests

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mock-registry:ci examples/mock-server

      - name: Smoke-test container boot
        run: |
          docker run -d --name mock-registry-test -p 9999:9999 mock-registry:ci
          for i in {1..30}; do
            if curl -sf http://localhost:9999/health > /dev/null; then
              echo "Container healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy"
          docker logs mock-registry-test
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f mock-registry-test || true
