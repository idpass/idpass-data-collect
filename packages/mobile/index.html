<!DOCTYPE html>
<html lang="en">

<head>
  <script>
  (function() {
    function showError(title, msg, source) {
      var el = document.getElementById('__error_overlay');
      if (!el) {
        el = document.createElement('div');
        el.id = '__error_overlay';
        el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1a1a2e;color:#e0e0e0;padding:24px;overflow:auto;font-family:monospace;font-size:14px;';
        document.body.appendChild(el);
      }
      el.innerHTML += '<div style="margin-bottom:16px;"><div style="color:#ff6b6b;font-weight:bold;font-size:16px;margin-bottom:8px;">' + title + '</div>'
        + '<pre style="white-space:pre-wrap;word-break:break-word;background:#2d2d44;padding:12px;border-radius:6px;border-left:4px solid #ff6b6b;">' + msg + '</pre>'
        + (source ? '<div style="color:#888;font-size:12px;margin-top:4px;">' + source + '</div>' : '')
        + '</div>';
    }
    window.onerror = function(msg, source, line, col) {
      showError('Uncaught Error', msg, source + ':' + line + ':' + col);
    };
    window.onunhandledrejection = function(e) {
      var msg = e.reason instanceof Error ? e.reason.stack || e.reason.message : String(e.reason);
      showError('Unhandled Promise Rejection', msg);
    };
    window.__showError = showError;
  })();
  </script>
  <link rel="preload" href="/node_modules/font-awesome/fonts/fontawesome-webfont.woff2?v=4.7.0" as="font"
    type="font/woff2" crossorigin>

    content="user-scalable=no, height=device-height, width=device-width, initial-scale=1.0, viewport-fit=cover" />

</head>
