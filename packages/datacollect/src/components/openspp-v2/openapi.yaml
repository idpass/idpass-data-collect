openapi: 3.0.3
info:
  title: OpenSPP API V2
  description: |
    Standards-aligned, consent-respecting REST API for social protection data exchange.

    ## Key Features
    - External identifiers only (no database IDs exposed)
    - Consent-based access control (GDPR-compliant)
    - Extensible for module-specific fields via extensions
    - G2P Connect / DCI compatible
    - RFC 9457 error responses
    - ADR-019 modernized response format

    ## Authentication
    OAuth 2.0 Client Credentials flow. Obtain a JWT bearer token from `/oauth/token`.

    ## Response Conventions (ADR-019)
    - Resource type discriminator: `type` (not `resourceType`)
    - Search results: `SearchResult` envelope with `data[]`, `meta`, `links`
    - Errors: RFC 9457 `ProblemDetail` schema is defined but most endpoints currently
      return plain `{"detail": "..."}` via FastAPI HTTPException. Full RFC 9457 error
      responses are a planned migration target.
    - Group classification: `groupType` (not `type`, to avoid collision with discriminator)
    - Batch/transaction: Legacy FHIR `Bundle` format with `resourceType`/`entry`
    - Advanced search (`_search`): Returns legacy `Bundle` format (not `SearchResult`)

    ## Extension Modules
    Additional endpoints are provided by auto-install bridge modules:
    - `spp_api_v2_vocabulary` - Vocabulary/code list management
    - `spp_api_v2_cycles` - Program cycle operations
    - `spp_api_v2_entitlements` - Entitlement operations
    - `spp_api_v2_service_points` - Service point operations
    - `spp_api_v2_products` - Product catalog
    - `spp_api_v2_change_request` - Change request workflow
    - `spp_api_v2_verifiable_credentials` - Verifiable credential issuance
    - `spp_studio_api_v2` - Studio custom fields and variables
    - `spp_api_v2_data` - Data push/pull operations
    - `spp_api_v2_drims` - Disaster response GeoJSON
  version: 2.0.0
  contact:
    name: OpenSPP Team
    url: https://openspp.org
  license:
    name: LGPL-3.0
    url: https://www.gnu.org/licenses/lgpl-3.0.html

servers:
  - url: https://api.openspp.org/api/v2/spp
    description: Production
  - url: https://staging-api.openspp.org/api/v2/spp
    description: Staging
  - url: http://localhost:8069/api/v2/spp
    description: Development

tags:
  - name: Metadata
    description: Server capability discovery and authentication
  - name: Individual
    description: Individual registrant operations
  - name: Group
    description: Household/group operations and membership management
  - name: Program
    description: Program operations (read-only)
  - name: ProgramMembership
    description: Program enrollment operations
  - name: Batch
    description: Batch and transaction bundle operations
  - name: Bulk
    description: Bulk export operations
  - name: Consent
    description: GDPR-compliant consent management
  - name: Filter
    description: Filter discovery and advanced search
  - name: ChangeRequest
    description: Change request workflow operations (spp_api_v2_change_request)
  - name: Vocabulary
    description: Vocabulary/code list management (spp_api_v2_vocabulary)
  - name: Cycle
    description: Program cycle operations (spp_api_v2_cycles)
  - name: Entitlement
    description: Entitlement operations (spp_api_v2_entitlements)
  - name: ServicePoint
    description: Service point operations (spp_api_v2_service_points)
  - name: Product
    description: Product catalog (spp_api_v2_products)
  - name: Credential
    description: Verifiable credential issuance and verification (spp_api_v2_verifiable_credentials)
  - name: Studio
    description: Studio custom fields and variables (spp_studio_api_v2)
  - name: Data
    description: Data push/pull operations (spp_api_v2_data)
  - name: DRIMS
    description: Disaster response GeoJSON endpoints (spp_api_v2_drims)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  /oauth/token:
    post:
      summary: Obtain access token
      description: |
        OAuth 2.0 Client Credentials flow. Returns a JWT bearer token.

        Rate limited to 5 requests/minute per IP to prevent brute force.
      tags: [Metadata]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Unsupported grant type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until rate limit resets

  # ---------------------------------------------------------------------------
  # Metadata
  # ---------------------------------------------------------------------------
  /metadata:
    get:
      summary: Get server capabilities
      description: |
        Returns API metadata with supported resources, operations, search
        parameters, available extensions, and authentication configuration.

        This endpoint is public (no authentication required).
      tags: [Metadata]
      security: []
      responses:
        '200':
          description: API metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMetadata'

  # ---------------------------------------------------------------------------
  # Individual
  # ---------------------------------------------------------------------------
  /Individual:
    get:
      summary: Search individuals
      description: |
        Search for individuals with pagination. Returns a `SearchResult` envelope.

        Supports consent-aware pagination: when consent filtering removes records,
        the API over-fetches to fill the requested page size.
      tags: [Individual]
      parameters:
        - $ref: '#/components/parameters/identifier'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/birthdate'
        - $ref: '#/components/parameters/gender'
        - $ref: '#/components/parameters/address'
        - name: group
          in: query
          description: "Group identifier (system|value) or 'none' for orphan individuals"
          schema:
            type: string
        - name: membership-role
          in: query
          description: "Membership role code (e.g., head, spouse, child)"
          schema:
            type: string
        - $ref: '#/components/parameters/_lastUpdated'
        - $ref: '#/components/parameters/_count'
        - $ref: '#/components/parameters/_offset'
        - $ref: '#/components/parameters/_sort'
        - $ref: '#/components/parameters/_elements'
        - $ref: '#/components/parameters/_extensions'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create individual
      description: |
        Create a new individual registrant.

        Sets `source_system` to `urn:openspp:api-client:{client_id}` for provenance tracking.
      tags: [Individual]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Individual'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
              description: URL of created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /Individual/{identifier}:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'

    get:
      summary: Read individual
      description: |
        Read an individual by external identifier.

        Security: For clients requiring consent, returns the same error for
        "not found" and "no consent" to prevent user enumeration.
      tags: [Individual]
      parameters:
        - $ref: '#/components/parameters/_elements'
        - $ref: '#/components/parameters/_extensions'
      responses:
        '200':
          description: Individual resource
          headers:
            ETag:
              schema:
                type: string
              description: Version ID for optimistic locking
            X-Consent-Status:
              schema:
                type: string
                enum: [active, no_consent, scope_mismatch]
              description: Consent status for this access
            X-Consent-Scope:
              schema:
                type: string
              description: Scope of granted consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update individual (full replacement)
      tags: [Individual]
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Individual'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      summary: Partial update individual (JSON Merge Patch)
      description: |
        Partially update an individual using JSON Merge Patch (RFC 7396).

        Only specified fields are updated. Omitted fields remain unchanged.
        Set a field to `null` to clear it.
      tags: [Individual]
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /Individual/{identifier}/groups:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'

    get:
      summary: Get group memberships for an individual
      description: |
        Reverse lookup: get all groups an individual belongs to.
      tags: [Individual]
      parameters:
        - name: status
          in: query
          description: Filter by membership status
          schema:
            type: string
            enum: [active, inactive]
        - name: _count
          in: query
          description: Maximum results (default 100)
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        '200':
          description: Group membership list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembershipBundle'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Group
  # ---------------------------------------------------------------------------
  /Group:
    get:
      summary: Search groups
      tags: [Group]
      parameters:
        - $ref: '#/components/parameters/identifier'
        - name: name
          in: query
          schema:
            type: string
        - name: type
          in: query
          description: Group type filter
          schema:
            type: string
            enum: [household, family, organization, other]
        - name: member
          in: query
          description: Has member (Individual identifier)
          schema:
            type: string
        - $ref: '#/components/parameters/_count'
        - $ref: '#/components/parameters/_offset'
        - $ref: '#/components/parameters/_elements'
        - $ref: '#/components/parameters/_extensions'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      summary: Create group
      tags: [Group]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '422':
          $ref: '#/components/responses/ValidationError'

  /Group/{identifier}:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'

    get:
      summary: Read group
      tags: [Group]
      parameters:
        - $ref: '#/components/parameters/_elements'
        - $ref: '#/components/parameters/_extensions'
      responses:
        '200':
          description: Group resource
          headers:
            ETag:
              schema:
                type: string
            X-Consent-Status:
              schema:
                type: string
            X-Consent-Scope:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update group (full replacement)
      tags: [Group]
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '409':
          $ref: '#/components/responses/Conflict'

    patch:
      summary: Partial update group (JSON Merge Patch)
      tags: [Group]
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /Group/{identifier}/$add-member:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'
    post:
      summary: Add member to group
      tags: [Group]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Member already exists in group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /Group/{identifier}/$remove-member:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'
    post:
      summary: Remove member from group
      tags: [Group]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveMemberRequest'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /Group/{identifier}/member/{individual_identifier}:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'
      - name: individual_identifier
        in: path
        required: true
        description: "Individual identifier. Format: {system}|{value}"
        schema:
          type: string
    patch:
      summary: Update member role or dates
      tags: [Group]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /Group/$merge:
    post:
      summary: Merge two groups
      description: |
        Move all members from source group to target group, then deactivate source.
        Requires `group:update` scope.
      tags: [Group]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeGroupRequest'
      responses:
        '200':
          description: Merged (returns target group)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /Group/{identifier}/$split:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'
    post:
      summary: Split group
      description: |
        Create a new group with some members from the existing group.
        Requires both `group:create` and `group:update` scopes.
      tags: [Group]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitGroupRequest'
      responses:
        '201':
          description: New group created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /Group/{identifier}/membership-history:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'
    get:
      summary: Get membership change history
      description: |
        Returns a `SearchResult` timeline of all membership additions,
        removals, and role changes.
      tags: [Group]
      parameters:
        - name: _count
          in: query
          description: Maximum results (default 100, max 500)
          schema:
            type: integer
            default: 100
            maximum: 500
        - $ref: '#/components/parameters/_offset'
        - name: _since
          in: query
          description: Only show events after this datetime (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Membership history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Program (read-only)
  # ---------------------------------------------------------------------------
  /Program:
    get:
      summary: Search programs
      description: |
        Search for programs. Uses cursor-based pagination (`_lastId`).
        Programs are read-only via the API (created in admin UI).
      tags: [Program]
      parameters:
        - $ref: '#/components/parameters/identifier'
        - name: name
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, ended]
        - name: type
          in: query
          description: Program type code
          schema:
            type: string
        - name: targetType
          in: query
          description: Target registrant type
          schema:
            type: string
            enum: [individual, group]
        - $ref: '#/components/parameters/_count'
        - name: _lastId
          in: query
          description: Cursor - ID of last record from previous page
          schema:
            type: integer
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

  /Program/{identifier}:
    get:
      summary: Read program
      tags: [Program]
      parameters:
        - $ref: '#/components/parameters/pathIdentifier'
      responses:
        '200':
          description: Program resource
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # ProgramMembership
  # ---------------------------------------------------------------------------
  /ProgramMembership:
    get:
      summary: Search program memberships
      tags: [ProgramMembership]
      parameters:
        - name: beneficiary
          in: query
          description: "Beneficiary reference (e.g., Individual/{system}|{value})"
          schema:
            type: string
        - name: program
          in: query
          description: "Program reference (e.g., Program/{system}|{value})"
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, enrolled, paused, exited, not_eligible, duplicated]
        - $ref: '#/components/parameters/_count'
        - $ref: '#/components/parameters/_offset'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

    post:
      summary: Create enrollment
      tags: [ProgramMembership]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramMembership'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramMembership'
        '422':
          $ref: '#/components/responses/ValidationError'

  /ProgramMembership/{identifier}:
    parameters:
      - $ref: '#/components/parameters/pathIdentifier'

    get:
      summary: Read program membership
      tags: [ProgramMembership]
      responses:
        '200':
          description: Program membership resource
          headers:
            ETag:
              schema:
                type: string
            X-Consent-Status:
              schema:
                type: string
            X-Consent-Scope:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramMembership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update program membership
      tags: [ProgramMembership]
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramMembership'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramMembership'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------------------
  # Batch
  # ---------------------------------------------------------------------------
  /$batch:
    post:
      summary: Execute batch or transaction bundle
      description: |
        Process multiple operations in a single request.

        - `transaction`: All-or-nothing (rollback on any failure)
        - `batch`: Independent operations (partial success allowed)

        Supports `urn:uuid:*` placeholder references between entries.
        The batch endpoint still uses the legacy Bundle format (resourceType/entry)
        for backward compatibility.
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bundle'
            example:
              resourceType: Bundle
              type: transaction
              entry:
                - fullUrl: "urn:uuid:ind-1"
                  request:
                    method: POST
                    url: Individual
                  resource:
                    type: Individual
                    identifier:
                      - system: "urn:gov:ph:psa:national-id"
                        value: "PH-NEW-001"
                    name:
                      given: Maria
                      family: Santos
                - fullUrl: "urn:uuid:grp-1"
                  request:
                    method: POST
                    url: Group
                  resource:
                    type: Group
                    identifier:
                      - system: "urn:openspp:group"
                        value: "HH-NEW-001"
                    groupType: household
                    member:
                      - entity:
                          reference: "urn:uuid:ind-1"
                        role:
                          coding:
                            - system: "urn:openspp:vocab:relationship"
                              code: head
      responses:
        '200':
          description: Bundle response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Bulk Export
  # ---------------------------------------------------------------------------
  /$bulk/export:
    post:
      summary: Bulk export resources by identifier
      description: |
        Retrieve multiple resources efficiently in a single request.
        Up to 100 identifiers per request.
      tags: [Bulk]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkExportRequest'
      responses:
        '200':
          description: Export results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkExportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # Consent
  # ---------------------------------------------------------------------------
  /Consent/{consent_id}:
    parameters:
      - name: consent_id
        in: path
        required: true
        description: Consent external identifier (UUID)
        schema:
          type: string
          format: uuid

    get:
      summary: Get consent status
      description: Check the current status of a consent record.
      tags: [Consent]
      responses:
        '200':
          description: Consent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'

    delete:
      summary: Revoke consent (DELETE method)
      description: Alternative RESTful method to revoke consent.
      tags: [Consent]
      parameters:
        - name: reason
          in: query
          description: Reason for revocation
          schema:
            type: string
      responses:
        '200':
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRevokeResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /Consent/{consent_id}/$revoke:
    parameters:
      - name: consent_id
        in: path
        required: true
        description: Consent external identifier (UUID)
        schema:
          type: string
          format: uuid
    post:
      summary: Revoke consent
      description: |
        Revoke a consent record. Per GDPR Article 7(3), withdrawal must
        be as easy as giving consent.

        Revocation is immediate, audited, and permanent.
      tags: [Consent]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRevokeRequest'
      responses:
        '200':
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRevokeResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /Consent/{consent_id}/$receipt:
    parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get consent receipt (ISO 29184)
      description: |
        Generate a consent receipt per ISO/IEC 29184 for the data subject.
        Provides proof of consent with purposes, data categories, and withdrawal URI.
      tags: [Consent]
      responses:
        '200':
          description: Consent receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReceiptSchema'
        '404':
          $ref: '#/components/responses/NotFound'

  /Consent/{consent_id}/$history:
    parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get consent version history
      description: Returns all changes made to the consent record for audit.
      tags: [Consent]
      responses:
        '200':
          description: Consent history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentHistoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /Consent/{consent_id}/$access-summary:
    parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get data access summary
