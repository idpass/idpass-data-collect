  # ---------------------------------------------------------------------------
  # Change Request (spp_api_v2_change_request)
  # ---------------------------------------------------------------------------
  /ChangeRequest:
    get:
      summary: Search change requests
      tags: [ChangeRequest]
      parameters:
        - name: registrant
          in: query
          description: "Registrant identifier (system|value)"
          schema:
            type: string
        - name: requestType
          in: query
          description: Change request type code
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending, revision, approved, rejected, applied]
        - name: createdAfter
          in: query
          description: Filter by creation date (on or after)
          schema:
            type: string
            format: date
        - name: createdBefore
          in: query
          description: Filter by creation date (on or before)
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/_count'
        - $ref: '#/components/parameters/_offset'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

    post:
      summary: Create change request
      description: Creates a change request in draft status.
      tags: [ChangeRequest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /ChangeRequest/{reference}:
    parameters:
      - name: reference
        in: path
        required: true
        description: "Change request reference (e.g., CR/2024/00001)"
        schema:
          type: string

    get:
      summary: Read change request
      tags: [ChangeRequest]
      responses:
        '200':
          description: Change request resource
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update change request detail
      description: Only draft change requests can be updated.
      tags: [ChangeRequest]
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /ChangeRequest/{reference}/$submit:
    parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Submit change request for approval
      tags: [ChangeRequest]
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ChangeRequest/{reference}/$approve:
    parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Approve change request
      tags: [ChangeRequest]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ChangeRequest/{reference}/$reject:
    parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Reject change request
      tags: [ChangeRequest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ChangeRequest/{reference}/$request-revision:
    parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Request revision on change request
      tags: [ChangeRequest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Revision requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ChangeRequest/{reference}/$apply:
    parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Apply approved change request
      description: Executes the changes to the registrant.
      tags: [ChangeRequest]
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ChangeRequest/{reference}/$reset:
    parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Reset rejected/revision CR to draft
      description: Allows resubmission after making changes.
      tags: [ChangeRequest]
      responses:
        '200':
          description: Reset to draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

